<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パーソルテンプスタッフ 中途採用 — 中途A（スライダー版）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { line-height: 0; background: #000; }

    /* ======================================================
       FV スライダー（手動クリック切替・無限ループ）
    ====================================================== */
    .fv-slider {
      position: relative;
      width: 100%;
      height: 100svh;
      overflow: hidden;
    }
    .fv-track {
      display: flex;
      height: 100%;
      will-change: transform;
    }

    /* スライド1枚 = 40vw → 2.5枚表示（2枚全体＋3枚目途中） */
    .fv-slide {
      flex-shrink: 0;
      width: 40vw;
      height: 100%;
    }
    .fv-slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* クリックゾーン（右端20vw = 3枚目が見えている部分） */
    #clickZone {
      position: absolute;
      right: 0;
      top: 0;
      width: 20vw;
      height: 100%;
      z-index: 10;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ===== FV スライダー ===== -->
  <div class="fv-slider">
    <div class="fv-track" id="fvTrack">

      <!-- 実画像 4枚 -->
      <div class="fv-slide">
        <img id="img0" src="../../top/中途A/中途A_1人目_最初.png" alt="">
      </div>
      <div class="fv-slide" id="slide1">
        <img id="img1" src="../../top/中途A/中途A_2人目_キャッチなし.png" alt="">
      </div>
      <div class="fv-slide">
        <img src="../../top/中途A/中途A_3人目.png" alt="">
      </div>
      <div class="fv-slide">
        <img src="../../top/中途A/中途A_4人目.png" alt="">
      </div>

      <!-- クローン 3枚（末尾シームレスループ用） -->
      <div class="fv-slide">
        <img src="../../top/中途A/中途A_1人目_最初.png" alt="">
      </div>
      <div class="fv-slide">
        <img src="../../top/中途A/中途A_2人目_キャッチなし.png" alt="">
      </div>
      <div class="fv-slide">
        <img src="../../top/中途A/中途A_3人目.png" alt="">
      </div>

    </div>

    <!-- クリックゾーン（3枚目の見えている右端20vw） -->
    <div id="clickZone"></div>
  </div>

  <script>
  (function () {
    'use strict';

    const track     = document.getElementById('fvTrack');
    const clickZone = document.getElementById('clickZone');
    const N_REAL    = 4;      // 実画像枚数
    const SLIDE_W   = 40;     // 1枚のスライド幅 (vw)
    const DURATION  = 700;    // スライドアニメーション (ms)
    let current     = 0;      // 現在の先頭インデックス
    let isAnimating = false;

    /* ── クリックで1枚進む（無限ループ） ── */
    function goNext() {
      if (isAnimating) return;
      isAnimating = true;

      current++;

      track.style.transition = `transform ${DURATION}ms cubic-bezier(0.4, 0, 0.2, 1)`;
      track.style.transform  = `translateX(${-current * SLIDE_W}vw)`;

      setTimeout(function () {
        /* N_REAL ステップ進んだらクローン → 実画像へ瞬時リセット */
        if (current >= N_REAL) {
          track.style.transition = 'none';
          track.style.transform  = 'translateX(0vw)';
          current = 0;
        }
        isAnimating = false;
      }, DURATION + 30);
    }

    clickZone.addEventListener('click', goNext);

    /* ── 2人目スライドのホバー連動 ── */
    const img0   = document.getElementById('img0');
    const img1   = document.getElementById('img1');
    const slide1 = document.getElementById('slide1');

    const SRC_1_INITIAL = '../../top/中途A/中途A_1人目_最初.png';
    const SRC_1_WHEN2   = '../../top/中途A/中途A_1人目_2人目表示時.png';
    const SRC_2_NOCATCH = '../../top/中途A/中途A_2人目_キャッチなし.png';
    const SRC_2_CATCH   = '../../top/中途A/中途A_2人目_キャッチあり.png';

    slide1.addEventListener('mouseenter', function () {
      img1.src = SRC_2_CATCH;
      if (current === 0) img0.src = SRC_1_WHEN2;
    });

    slide1.addEventListener('mouseleave', function () {
      img1.src = SRC_2_NOCATCH;
      img0.src = SRC_1_INITIAL;
    });

  }());
  </script>

</body>
</html>

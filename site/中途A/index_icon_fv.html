<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パーソルテンプスタッフ 中途採用 — 中途A</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      opacity: 0;
      animation: bodyFade 0.5s ease 0.1s forwards;
    }
    @keyframes bodyFade { to { opacity: 1; } }

    /* ======================================================
       FV
    ====================================================== */
    .fv {
      position: relative;
      width: 100%;
      min-height: 100svh;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    /* 画像ストリップ */
    .fv__strip {
      position: relative;
      width: 100%;
    }

    /* Layer 共通 */
    .fv__layer {
      display: block;
      width: 100%;
      line-height: 0;
    }
    .fv__layer img {
      display: block;
      width: 100%;
    }

    /* Layer 1: 横長（ベース） */
    .fv__layer--base {
      opacity: 0;
      animation: baseAppear 0.8s ease 0.2s forwards;
    }
    @keyframes baseAppear { to { opacity: 1; } }

    /* Layer 2: hover（キャッチコピー付き） */
    .fv__layer--hover {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      opacity: 0;
      transform: translateX(3%);
      will-change: opacity, transform;
    }

    /* ---- SCROLL indicator ---- */
    .fv__scroll {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 11px;
      letter-spacing: 0.15em;
      font-family: 'Helvetica Neue', sans-serif;
      opacity: 0;
      transition: opacity 0.7s ease;
      pointer-events: none;
    }
    .fv__scroll.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .fv__scroll-bar {
      width: 1px;
      height: 44px;
      background: rgba(255, 255, 255, 0.25);
      position: relative;
      overflow: hidden;
    }
    .fv__scroll-bar::after {
      content: '';
      position: absolute;
      top: -100%; left: 0;
      width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.85);
      animation: scrollBar 1.5s ease-in-out infinite;
    }
    @keyframes scrollBar {
      0%   { top: -100%; }
      100% { top:  100%; }
    }

    /* ======================================================
       TOPデザイン画像
    ====================================================== */
    .design-section {
      position: relative;
      line-height: 0;
      background: #fff;
    }
    .design-section img {
      display: block;
      width: 100%;
    }
    .design-section__link {
      position: absolute;
      display: block;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ===== FV ===== -->
  <div class="fv" id="fv">

    <div class="fv__strip">

      <!-- Layer 1: 横長（ベース表示） -->
      <div class="fv__layer fv__layer--base">
        <img src="../../top/中途A/中途A_横長.jpg"
             alt="パーソルテンプスタッフ 中途採用">
      </div>

      <!-- Layer 2: hover（キャッチコピー付き・右からスライドイン） -->
      <div class="fv__layer fv__layer--hover" id="fvHover">
        <img src="../../top/中途A/中途A_hover.jpg" alt="">
      </div>

    </div>

    <!-- SCROLL indicator -->
    <div class="fv__scroll" id="fvScrollInd">
      <span>SCROLL</span>
      <div class="fv__scroll-bar"></div>
    </div>

  </div>

  <!-- ===== TOP デザイン画像 ===== -->
  <div class="design-section">
    <img src="../../top/中途A/中途A_top_icon_saisyu.jpg"
         alt="中途A TOP アイコン版">
    <!-- ビジネスイノベーション → 仕事・業務要件詳細へ -->
    <a href="/site/中途B/job_detail.html"
       class="design-section__link"
       style="top:68.4%;left:0;width:30.9%;height:6.5%;"
       aria-label="ビジネスイノベーション"></a>
  </div>

  <script>
  (function () {
    'use strict';

    const hoverEl   = document.getElementById('fvHover');
    const scrollInd = document.getElementById('fvScrollInd');

    /* ---- easing ---- */
    function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

    /* ---- アニメーション設定 ---- */
    const DELAY    = 900;   // ベース表示後の待機 (ms)
    const DURATION = 1800;  // hover スライドイン時間 (ms)

    let startTime = null;

    function tick(ts) {
      if (!startTime) startTime = ts;
      const raw = (ts - startTime) / DURATION;
      const t   = Math.min(raw, 1);
      const e   = easeOut(t);

      /* hover layer:
         opacity  0 → 1
         translateX  +3% → 0  (右から流れてくる) */
      hoverEl.style.opacity   = String(e);
      hoverEl.style.transform = `translateX(${(1 - e) * 3}%)`;

      if (t < 1) {
        requestAnimationFrame(tick);
      } else {
        /* 完了 → SCROLLインジケーター表示 */
        setTimeout(() => scrollInd.classList.add('visible'), 500);
      }
    }

    /* ベース画像が見えてからスライドイン開始 */
    setTimeout(() => requestAnimationFrame(tick), DELAY);

  }());
  </script>

</body>
</html>
